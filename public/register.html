<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — PROTUBE.STORE</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">▶</div>
      <div class="brand-name">PROTUBE<span>.STORE</span></div>
    </div>
  </div>

  <div class="page">
    <h1>Tạo tài khoản</h1>
    <div class="sub">Đã có tài khoản? <a href="/login.html" style="color:var(--gold); font-weight:700;">Đăng nhập</a></div>

    <div id="msg" class="msg"></div>

    <form id="regForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label>Mật khẩu (tối thiểu 6 ký tự)</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button class="btn" type="submit">Đăng ký</button>
    </form>

    <div class="link-row">
      Quay lại <a href="/index.html">trang chủ</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          })
        });
        window.location.href = '/index.html';
      } catch (e2) {
        showMsg(msg, e2.message, 'error');
      }
    });
  </script>
</body>
</html>
